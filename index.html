<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오늘의 행운의 색 뽑기</title>
    <style>
        body { background-color: #111; margin: 0; overflow: hidden; cursor: none; display: flex; flex-direction: column; align-items: center; }
        .line { position: absolute; background-color: rgba(255, 255, 255, 0.1); pointer-events: none; z-index: 1; }
        .horizontal { width: 100%; height: 1px; top: 0; left: 0; }
        .vertical { width: 1px; height: 100%; left: 0; }
        #message { position: fixed; top: 20%; color: white; font-size: 22px; text-align: center; pointer-events: none; z-index: 10; line-height: 1.8; }
        .box { position: absolute; width: 80px; height: 80px; border: 3px solid white; margin-left: -40px; margin-top: -40px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; pointer-events: none; transition: background-color 0.2s ease; z-index: 5; top: 0; left: 0; }
        
        /* 강조 텍스트 스타일 */
        .color-name { font-size: 32px; font-weight: bold; display: block; margin-bottom: 5px; }
        .rgb-code { font-size: 18px; opacity: 0.8; font-family: monospace; }
    </style>
</head>
<body>

    <div id="message">화면을 클릭해서<br>오늘의 행운의 색을 확인해보세요!</div>
    <div class="line horizontal"></div>
    <div class="line vertical"></div>
    <div class="box">?</div>

    <script>
        const horizontal = document.querySelector('.horizontal');
        const vertical = document.querySelector('.vertical');
        const box = document.querySelector('.box');
        const message = document.querySelector('#message');

        // [전문가의 팁] 이름과 RGB 코드를 함께 담았습니다.
        const luckyColors = [
            { name: "따뜻한 햇살 노랑", rgb: "rgb(255, 215, 0)", hex: "#FFD700" },
            { name: "평온한 바다 파랑", rgb: "rgb(30, 144, 255)", hex: "#1E90FF" },
            { name: "싱그러운 숲 초록", rgb: "rgb(50, 205, 50)", hex: "#32CD32" },
            { name: "정열적인 장미 빨강", rgb: "rgb(255, 69, 0)", hex: "#FF4500" },
            { name: "우아한 라벤더 보라", rgb: "rgb(147, 112, 219)", hex: "#9370DB" },
            { name: "포근한 솜사탕 분홍", rgb: "rgb(255, 182, 193)", hex: "#FFB6C1" },
            { name: "깊은 밤 에메랄드", rgb: "rgb(0, 139, 139)", hex: "#008B8B" },
            { name: "활기찬 오렌지", rgb: "rgb(255, 140, 0)", hex: "#FF8C00" },
            { name: "클래식 실버", rgb: "rgb(192, 192, 192)", hex: "#C0C0C0" },
            { name: "신비로운 민트", rgb: "rgb(127, 255, 212)", hex: "#7FFFD4" }
        ];

        let mouseX = 0, mouseY = 0, rotate = 0;
        let requestID;
        let isRunning = true;
        let selectedLuck = luckyColors[0];

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            vertical.style.transform = `translateX(${mouseX}px)`;
            horizontal.style.transform = `translateY(${mouseY}px)`;
            if (!isRunning) updatePosition();
        });

        function updatePosition() {
            box.style.transform = `translate(${mouseX}px, ${mouseY}px) rotate(${rotate}deg)`;
        }

        document.addEventListener('click', () => {
            if (isRunning) {
                cancelAnimationFrame(requestID);
                isRunning = false;
                box.innerHTML = 'LUCKY';
                // 이름과 RGB 코드를 함께 표시합니다.
                message.innerHTML = `오늘의 행운의 색은<br>
                    <span class="color-name" style="color:${selectedLuck.hex};">${selectedLuck.name}</span>
                    <span class="rgb-code" style="color:${selectedLuck.hex};">(${selectedLuck.rgb})</span> 입니다!`;
            } else {
                isRunning = true;
                box.innerHTML = '?';
                message.innerHTML = "화면을 클릭해서<br>오늘의 행운의 색을 확인해보세요!";
                animate();
            }
        });

        function animate() {
            if (isRunning) {
                selectedLuck = luckyColors[Math.floor(Math.random() * luckyColors.length)];
                box.style.backgroundColor = selectedLuck.hex;
                rotate += 5;
            }
            updatePosition();
            requestID = requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
